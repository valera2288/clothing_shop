<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Онлайн-магазин одежды: каталог, корзина, заказы и доставка.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5E35B1">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Магазин одежды">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Магазин одежды</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Заставка на время загрузки: без неё пользователь видит белый экран,
       пока скачивается и запускается main.dart.js */
    html, body { margin: 0; height: 100%; background: #fdf8ff; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: Roboto, "Segoe UI", Arial, sans-serif; color: #311b92;
      background: #fdf8ff; z-index: 10; transition: opacity .3s;
    }
    #splash h1 { margin: 0; font-size: 28px; font-weight: 500; }
    #splash p { margin: 0; font-size: 14px; color: #625b71; }
    #splash .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid #e0d7f0; border-top-color: #5e35b1;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #14111f; color: #d1c4e9; }
      #splash p { color: #b4a9c8; }
      #splash .spinner { border-color: #2e2740; border-top-color: #b39ddb; }
    }
    @media (prefers-reduced-motion: reduce) { #splash .spinner { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Магазин одежды</h1>
    <p>Загрузка приложения…</p>
    <noscript><p>Для работы приложения нужен включённый JavaScript.</p></noscript>
  </div>
  <script>
    // Flutter сообщает о первом нарисованном кадре: заставку можно убирать
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
